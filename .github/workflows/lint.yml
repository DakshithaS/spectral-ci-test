name: Lint OpenAPI Spec

on:
  pull_request:
    paths:
      - "openapi.yaml"
      - ".spectral.yaml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  spectral-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx spectral lint openapi.yaml --fail-severity=error --format github-actions

