name: Lint OpenAPI Spec

on:
  pull_request:

permissions:
  contents: read

jobs:
  spectral-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx spectral lint openapi.yaml --fail-severity=error --format github-actions
